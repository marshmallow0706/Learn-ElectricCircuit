<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
<rect width="400" height="220" fill="#ffffff"/>
<polyline points="110,110 110,110" fill="none" stroke="#22303c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="190,110 190,110" fill="none" stroke="#22303c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,110 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#22303c" stroke-width="2" stroke-linecap="round"/><text x="150" y="86" text-anchor="middle" font-size="14" fill="#22303c" font-weight="400" font-style="normal" font-family="Noto Sans JP, Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">L（コイル）</text><line x1="90" y1="70" x2="210" y2="70" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><polygon points="210,70 201.8,73.7 201.8,66.3" fill="#c0392b"/><text x="150" y="58" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="400" font-style="normal" font-family="Noto Sans JP, Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">流れている電流</text><text x="150" y="170" text-anchor="middle" font-size="14" fill="#22303c" font-weight="400" font-style="normal" font-family="Noto Sans JP, Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">コイルは「今の電流を保とう」とする</text><text x="150" y="196" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="400" font-style="normal" font-family="Noto Sans JP, Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">急に止めると高い電圧が発生する（逆起電力）</text>
